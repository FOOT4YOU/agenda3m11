<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3M11">
<title>Agenda 3M11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mut:#6e6e73;--fnt:#aeaeb2;--line:#e8e8ea;--soft:#f4f4f5;
--sans:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--mut:#98989d;--fnt:#5a5a5e;--line:#232325;--soft:#141416;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
html{touch-action:manipulation}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:calc(18px + var(--sat)) max(20px,var(--sar)) calc(110px + var(--sab)) max(20px,var(--sal))}
h1{font-size:32px;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.08}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 22px}
.hd .sub{color:var(--mut);font-size:14px;margin-top:4px}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ib svg{width:19px;height:19px}
.sec{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:28px 0 8px}
.mut{color:var(--mut)}.sm{font-size:13px}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:15px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:60px}
.row.rv{border-left:3px solid var(--c);padding-left:10px}
.dt{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
.row.mute{min-height:44px;padding:9px 2px}.row.mute .n{font-size:14px;font-weight:500;color:var(--mut)}
.du{font-size:13px;font-weight:500;color:var(--mut);margin-left:8px}
.row.nx{background:var(--soft);border-radius:14px;border-bottom-color:transparent;padding-right:10px}
.ck.sm2{width:24px;height:24px;border-width:1.5px;border-color:var(--fnt)}.ck.sm2.on{border-color:var(--fg)}
.pill2{border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:340px}.rate button{background:rgba(255,255,255,.12);color:#fff;border-radius:18px;padding:14px 6px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}.rate button span{font-size:28px}
.row .t{font-family:var(--mono);font-size:13px;color:var(--mut);width:46px;flex:none;white-space:nowrap}
.wk .row .t{width:62px}
.row .m{flex:1;min-width:0}.row .n{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:13px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .n{text-decoration:line-through;color:var(--fnt)}.row.done .d{color:var(--fnt)}
.row .go{width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.row .go svg{width:12px;height:12px;margin-left:2px}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--fg);display:grid;place-items:center;flex:none;color:var(--bg)}
.ck svg{width:14px;height:14px;opacity:0}.ck.on{background:var(--fg)}.ck.on svg{opacity:1}
.exam{background:var(--fg);color:var(--bg);border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;width:100%;text-align:left}
.exam b{font-size:17px}.exam span{font-size:13px;opacity:.7}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--mut);margin-left:6px;vertical-align:2px}
.empty{color:var(--mut);padding:26px 0;text-align:center}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.btn{white-space:nowrap;border-radius:16px;background:var(--fg);color:var(--bg);font-weight:700;padding:15px 16px;font-size:16px;width:100%;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.o{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.btn.g{background:var(--soft);color:var(--fg)}
.btn:disabled{opacity:.4}
.btn svg{width:16px;height:16px}
.cc{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:20px;padding:14px 16px;margin-bottom:18px}
.cc .av{width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.cc p{margin:2px 0 0;font-size:15px;line-height:1.45}.cc b{font-size:13px}
.cc .rf{margin-left:auto;color:var(--mut);font-size:12px;flex:none}
.away{border:2px solid var(--fg);border-radius:22px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;margin-bottom:18px}
.away .e{font-size:44px}.away b{font-size:22px;letter-spacing:-.02em}
.nav{display:flex;gap:8px}
/* calendrier */
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.mh b{font-size:19px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.grid .w{font-size:11px;font-weight:700;color:var(--mut);text-align:center;padding-bottom:6px}
.c{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;position:relative}
.c b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.c.o{opacity:.25}.c.td b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.c.sel{background:var(--soft)}
.c.ex{background:var(--fg);color:var(--bg)}
.c i{width:5px;height:5px}
.c i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
.c .x{font-size:9px;font-weight:800;letter-spacing:.03em}
.wk .row{min-height:52px;padding:12px 2px}
/* tests */
.tc{display:flex;align-items:center;gap:14px;padding:16px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.bd{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--fg);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.bd.f{background:var(--fg);color:var(--bg)}
.tc .m{flex:1;min-width:0}.tc .n{font-weight:700;font-size:17px}.tc .d{font-size:13px;color:var(--mut)}
.tc .j{white-space:nowrap;font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pb{height:4px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.pb i{display:block;height:100%;background:var(--fg)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-weight:600;font-size:15px;margin:4px 0 14px}
.back svg{width:18px;height:18px}
.coach{border:1.5px solid var(--fg);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.coach h3{margin:0;font-size:19px;letter-spacing:-.02em}
.mic{width:72px;height:72px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;margin:2px auto;position:relative;flex:none}
.mic svg{width:28px;height:28px}
.mic.on::before,.mic.on::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--fg);animation:ring 1.6s infinite;opacity:0}.mic.on::after{animation-delay:.8s}
@keyframes ring{0%{transform:scale(.85);opacity:.8}100%{transform:scale(1.35);opacity:0}}
.hint{font-size:13px;color:var(--mut);text-align:center;min-height:1.2em}
textarea,input,select{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;font-size:16px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.45}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.files{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.th{width:54px;height:54px;border-radius:10px;background:var(--soft) center/cover;border:1px solid var(--line)}
.addf{height:54px;padding:0 14px;border-radius:10px;border:1.5px dashed var(--fnt);display:flex;align-items:center;gap:6px;color:var(--mut);font-size:14px;font-weight:600}
.addf svg{width:18px;height:18px}
.err{color:#d70015;font-size:14px;min-height:1em}
.prog{font-size:14px;display:flex;align-items:center;gap:10px}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;margin:6px 0 16px;overflow-x:auto}
.seg button{flex:1;padding:9px 10px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fiche h4{font-size:17px;margin:20px 0 6px;letter-spacing:-.01em}.fiche ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.fiche li{font-size:15.5px}.fiche .df{padding:10px 0;border-bottom:1px solid var(--line)}.fiche .df b{display:block}
.card3{perspective:1000px;height:260px;margin:6px 0 14px}
.flip{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border:1.5px solid var(--fg);border-radius:22px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:19px;font-weight:600;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto}
.face.b{background:var(--fg);color:var(--bg);transform:rotateY(180deg);font-weight:500;font-size:17px}
.qz .ch{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px;font-size:16px}
.qz .ch.ok{border-color:var(--fg);background:var(--fg);color:var(--bg)}.qz .ch.ko{border-style:dashed;color:var(--mut);text-decoration:line-through}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{padding:11px 14px;border-radius:16px;font-size:15px;max-width:90%;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--fg);color:var(--bg)}.msg.a{align-self:flex-start;background:var(--soft)}
.msg ul{margin:4px 0;padding-left:18px;white-space:normal}
/* notes */
.sum{border:2px solid var(--fg);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sum .big{display:flex;align-items:baseline;gap:8px}.sum .big b{font-size:44px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.sum .st{font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px}.kv span:nth-child(even){font-weight:700;font-family:var(--mono)}
.br{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.br .m{flex:1;min-width:0}.br .n{font-weight:600;font-size:16px}
.sq{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.sq i{min-width:30px;height:24px;border-radius:6px;border:1px solid var(--line);font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
.sq i.e{border-style:dashed;color:var(--fnt)}.sq i.l{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.br .av{font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.br .av.low{text-decoration:underline;text-decoration-style:wavy;text-underline-offset:5px}
.nl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.nl .v{font-size:20px;font-weight:800;width:48px;font-family:var(--mono)}.nl .m{flex:1;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px max(10px,var(--sal)) calc(6px + var(--sab))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--fnt);padding:5px 0}
.tab svg{width:23px;height:23px}.tab.on{color:var(--fg)}
.fab{width:54px;height:54px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;margin:0 8px}
.fab svg{width:24px;height:24px}
/* feuilles */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{background:var(--bg);width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px max(20px,var(--sal)) calc(24px + var(--sab));animation:up .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 2px}
.sheet h3{font-size:22px;font-weight:800;letter-spacing:-.025em;margin:0}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:18px;width:100%;text-align:left}
.opt svg{width:22px;height:22px;flex:none}.opt b{display:block;font-size:16px}.opt span{font-size:13px;color:var(--mut)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}}
.set .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set input[type=time],.set input[type=number]{width:auto;padding:8px 10px;font-size:15px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--fg)}.sw.on::after{transform:translateX(20px)}
/* session */
#sess{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(20px + var(--sat)) 24px calc(28px + var(--sab));background:#000;color:#fff;overflow:hidden;transition:background .8s}
#sess.on{display:flex;animation:fd .3s}#sess.pz{background:#1c1c1e}
#sess .top{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center}
#sess .top button{background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:9px 15px;font-weight:600;font-size:14px}
#sess .ph{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
#sess .sb{font-size:34px;font-weight:800;letter-spacing:-.035em;text-align:center;margin-top:6px}
#sess .rw{position:relative;width:min(76vw,300px);aspect-ratio:1}
#sess svg.ring{width:100%;height:100%;transform:rotate(-90deg)}
#sess .ring circle{fill:none;stroke-width:3}#sess .ring .b{stroke:rgba(255,255,255,.15)}#sess .ring .f{stroke:var(--sc,#fff);stroke-linecap:round;transition:stroke-dashoffset .5s linear}
#sess .clk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#sess .clk b{font-family:var(--mono);font-size:min(16vw,66px);font-weight:700;letter-spacing:-.02em}
#sess .clk small{font-size:13px;opacity:.65}
#sess .orb{position:absolute;inset:16%;border-radius:50%;background:rgba(255,255,255,.07);animation:br 8s ease-in-out infinite;display:none}
#sess.pz .orb{display:block}
@keyframes br{0%,100%{transform:scale(.7)}50%{transform:scale(1)}}
#sess .pl{position:absolute;inset:0;border-radius:50%;animation:pl 2.6s infinite}
#sess.pz .pl,#sess.hold .pl{animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,255,255,.22)}100%{box-shadow:0 0 0 28px rgba(255,255,255,0)}}
#sess .cy{display:flex;gap:8px}#sess .cy i{width:26px;height:5px;border-radius:9px;background:rgba(255,255,255,.22)}#sess .cy i.d{background:var(--sc,#fff)}#sess .cy i.c{background:rgba(255,255,255,.6)}
#sess .tip{max-width:440px;text-align:center;font-size:15px;opacity:.85;min-height:2.8em}
#sess .ct{display:flex;gap:12px;align-items:center}
#sess .ct button{border-radius:999px;font-weight:700}
#sess .bg{width:76px;height:76px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
#sess .bg svg{width:26px;height:26px}
#sess .s2{background:rgba(255,255,255,.14);color:#fff;padding:13px 16px;font-size:14px}
#sess .ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;background:#000}
#sess.end .ov.fin,#sess.eat .ov.food{display:flex}
#sess .ov h2{font-size:34px;font-weight:800;margin:0;letter-spacing:-.03em}#sess .ov p{margin:0;opacity:.8;font-size:16px}
#sess .ov .btn{background:#fff;color:#000;max-width:280px}
.cf{position:absolute;top:-10px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:70;animation:up .25s;max-width:90vw;text-align:center}
.sync{font-size:11px;color:var(--fnt);text-align:center;margin-top:30px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="sheet"></div>
<div id="sess" aria-live="polite"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="image/*,application/pdf" multiple hidden>
<script>
/* Pont IA pour l'app iPhone (hors de Claude) : appelle l'API Anthropic avec ta clé */
if(!window.claude){window.NATIVE=true;
  const K=()=>{try{return localStorage.getItem("ag3m11_key")||""}catch(e){return ""}};
  const b64=b=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=ko;r.readAsDataURL(b)});
  async function call(input,o){o=o||{};const key=K();if(!key)throw{code:"no_key",message:"Ajoute ta clé API dans Réglages pour utiliser l'IA."};
    const msgs=typeof input==="string"?[{role:"user",content:input}]:input.map(m=>({role:m.role,content:m.content}));

    case "start":ui.sheet=null;renderSheet();startSess(v,b.dataset.w,b.dataset.p,b.dataset.free);break;
    case "shold":if(S2.pausedAt){S2.held+=Date.now()-S2.pausedAt;S2.pausedAt=null}else S2.pausedAt=Date.now();saveSess();drawSess();break;
    case "seat":if(!S2.pausedAt)S2.pausedAt=Date.now();S2.eat=true;saveSess();drawSess();break;
    case "seatok":S2.eat=false;if(S2.pausedAt){S2.held+=Date.now()-S2.pausedAt;S2.pausedAt=null}saveSess();drawSess();break;
    case "splus":S2.ph[S2.i].m+=5;saveSess();updSess(phaseLeft());break;
    case "sstop":finishSess(false);break;
    case "sclose":if(S2&&!S2.end){if(!b.dataset.c){b.dataset.c=1;b.textContent="Sûr ? Rien ne sera compté";break}clearInterval(sTimer);try{localStorage.removeItem("ag3m11_sess")}catch(x){}}S2=null;drawSess();render();break;
    case "sdone":S2=null;drawSess();render();break;
    case "opentest":ui.tab="tests";ui.test=v;ui.tv=kitGet(v)?"rev":"coach";ui.kv="fiche";ui.cs=null;ui.qs=null;ui.cz=null;ui.del=false;render();window.scrollTo(0,0);break;
    case "closetest":ui.test=null;render();break;
    case "tv":ui.tv=v;render();break;
    case "kv":ui.kv=v;render();break;
    case "flip":ui.cs.f=!ui.cs.f;render();break;
    case "cok":case "cko":{const k=kitGet(ui.test),C=k.cartes,S3=ui.cs,i=S3.i%C.length;if(a==="cko"&&!S3.ko.includes(i))S3.ko.push(i);if(a==="cok")S3.ko=S3.ko.filter(x=>x!==i);S3.i++;S3.f=false;render();break}
    case "qa":{const k=kitGet(ui.test),q=k.quiz[ui.qs.i];ui.qs.a=+v;if(+v===q.bonne)ui.qs.ok++;render();break}
    case "qn":ui.qs.i++;ui.qs.a=null;render();break;
    case "qre":ui.qs={i:0,a:null,ok:0};render();break;
    case "mic":{if(ui.sheet&&ui.sheet.k==="newtest")micClick("a_txt",ui.sheet);else{ui.cz=ui.cz||{files:[],txt:"",busy:null,err:""};micClick("c_txt",ui.cz)}break}
    case "pickf":{const fi=document.getElementById("fileIn");fi.dataset.for=v;fi.value="";fi.click();break}
    case "clrf":ui.cz.files=[];render();break;
    case "ai":aiNew();break;
    case "addok":addOk();break;
    case "addback":ui.sheet.res=null;renderSheet();break;
    case "build":{const t=testOf(ui.test),cz=ui.cz||(ui.cz={files:[],txt:"",busy:null,err:""});cz.txt=document.getElementById("c_txt").value;if(!cz.txt.trim()&&!cz.files.length&&!t.obj){cz.err="Mets au moins des photos ou dis ce qu'il faut savoir.";render();break}buildKit(t,null,cz.txt);break}
    case "ask":{const q=document.getElementById("q"),txt=v||(q&&q.value.trim());if(q)q.value="";ask(txt);break}
    case "deltest":if(!ui.del){ui.del=true;render();break}st.tests=st.tests.filter(t=>t.id!==ui.test);st.log=st.log.filter(l=>l.testId!==ui.test);ui.test=null;ui.del=false;persist();render();toast("Test supprimé");break;
    case "sw":{const[k,f]=v.split(".");S[k][f]=!S[k][f];persist();ui.sheet.keep=true;render();break}
    case "off":{const d=document.getElementById("offd").value;if(d&&!S.offDays.includes(d)){S.offDays.push(d);persist();ui.sheet.keep=true;render()}break}
    case "unoff":S.offDays=S.offDays.filter(x=>x!==v);persist();ui.sheet.keep=true;render();break;
    case "branch":ui.sheet={k:"branch",id:v};renderSheet();break;
    case "noteok":{const br=st.branches.find(x=>x.id===ui.sheet.id),val=parseFloat(String(document.getElementById("n_v").value).replace(",","."));if(isNaN(val)||val<1||val>6){document.getElementById("n_err").textContent="Une note entre 1 et 6.";break}
      br.notes.push({id:uid(),v:val,w:+document.getElementById("n_w").value,label:document.getElementById("n_l").value.trim()});persist();ui.sheet.keep=true;render();break}
    case "delnote":{const br=st.branches.find(x=>x.id===ui.sheet.id);br.notes=br.notes.filter(n=>n.id!==v);persist();ui.sheet.keep=true;render();break}
    case "lock":{const br=st.branches.find(x=>x.id===ui.sheet.id);br.locked=true;persist();render();break}
    case "unlock":{const br=st.branches.find(x=>x.id===ui.sheet.id);br.locked=false;persist();render();break}
    case "lockok":{const br=st.branches.find(x=>x.id===ui.sheet.id),val=parseFloat(String(document.getElementById("lk").value).replace(",","."));br.lockedV=isNaN(val)?null:Math.max(1,Math.min(6,val));persist();ui.sheet=null;render();break}
    case "delbranch":if(!ui.sheet.del){ui.sheet.del=true;ui.sheet.keep=true;renderSheet();break}st.branches=st.branches.filter(x=>x.id!==ui.sheet.id);persist();ui.sheet=null;render();break;
    case "addbranch":st.branches.push({id:uid(),name:"Nouvelle branche",tag:"",locked:false,lockedV:null,notes:[]});persist();ui.sheet={k:"branch",id:st.branches[st.branches.length-1].id};render();break;
  }});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="q"){e.preventDefault();const t=e.target.value.trim();e.target.value="";ask(t)}if(e.key==="Escape"&&ui.sheet){ui.sheet=null;renderSheet()}});
document.addEventListener("input",e=>{if(e.target.id==="c_txt"&&ui.cz)ui.cz.txt=e.target.value;if(e.target.id==="a_txt"&&ui.sheet)ui.sheet.txt=e.target.value});
document.addEventListener("change",async e=>{const el=e.target;
  if(el.dataset.key){try{localStorage.setItem("ag3m11_key",el.value.trim())}catch(x){}toast("Clé enregistrée");return}
  if(el.dataset.set){const path=el.dataset.set.split(".");let o=st.settings;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=el.type==="number"?Math.max(0,+el.value||0):el.value;persist();if(ui.sheet)ui.sheet.keep=true;render();return}
  if(el.dataset.tf){const t=testOf(ui.test);if(!t)return;const k=el.dataset.tf;if(k==="hours"){t.min=Math.max(30,Math.round(+el.value*60)||30);t.minSet=true}else if(k==="w")t.w=+el.value;else t[k]=el.value;if(k==="date"&&!t.time)t.time=clsTime(t.date,t.sub);persist();render();return}
  if(el.dataset.en){const br=st.branches.find(x=>x.id===ui.sheet.id),n=br&&br.notes.find(x=>x.id===el.dataset.en),val=parseFloat(String(el.value).replace(",","."));if(n&&!isNaN(val)&&val>=1&&val<=6){n.v=val;persist();ui.sheet.keep=true;render()}return}
  if(el.dataset.pn){const br=st.branches.find(x=>x.id===ui.sheet.id),t=testOf(el.dataset.pn),val=parseFloat(String(el.value).replace(",","."));if(!br||!t||isNaN(val)||val<1||val>6)return;br.notes.push({id:uid(),v:val,w:1,label:t.title,testId:t.id});persist();ui.sheet.keep=true;render();return}
  if(el.id==="fileIn"){const target=el.dataset.for==="new"?ui.sheet:(ui.cz=ui.cz||{files:[],txt:"",busy:null,err:""});if(!target)return;
    const ta=document.getElementById(el.dataset.for==="new"?"a_txt":"c_txt");if(ta)target.txt=ta.value;
    target.busy="Préparation des fichiers…";el.dataset.for==="new"?renderSheet():render();
    try{for(const f of [...el.files]){if(target.files.length>=80)break;target.files=target.files.concat(await toImgs(f)).slice(0,80)}}catch(x){target.err="Un fichier n'a pas pu être lu. Envoie plutôt une photo."}
    target.busy=null;el.dataset.for==="new"?renderSheet():render()}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){P=null;if(S2&&!S2.end)tickSess();render()}});
setInterval(()=>{if(!S2&&!ui.sheet&&ui.tab==="jour"&&!document.activeElement.matches("input,textarea")){const k=Math.floor(nowCut()/5);if(k!==PT){P=null;render()}}},30000);
/* ===== démarrage ===== */
try{const s=JSON.parse(localStorage.getItem("ag3m11_sess")||"null");if(s&&s.id&&Date.now()-s.start<4*3600e3){S2=s;sTimer=setInterval(tickSess,250)}}catch(e){}
if(st.away&&Date.now()-st.away.at>3*3600e3)st.away=null;
render();if(S2)drawSess();
(async()=>{try{
  const [d1,s1,di]=await Promise.all([claude.use("db"),claude.use("sample"),claude.use("dictation")]);
  sample=s1;dict=di;
  if(sample){try{const l=await sample.limits();imgMax=l.images?l.images.maxCount:0}catch(e){}}
  if(dict){dict.onPartial(({text})=>{const h=document.getElementById(micTarget&&micTarget.fid==="a_txt"?"a_live":"c_live");if(h)h.textContent=text});
    dict.onFinal(({text})=>{if(!micTarget)return;const ta=document.getElementById(micTarget.fid);const base=(ta?ta.value:micTarget.state.txt)||"";micTarget.state.txt=(base?base.trim()+" ":"")+text;if(ta)ta.value=micTarget.state.txt});
    dict.onState(({state})=>{if(!micTarget)return;const ta=document.getElementById(micTarget.fid);if(ta)micTarget.state.txt=ta.value;micTarget.state.rec=state==="listening";micTarget.fid==="a_txt"?renderSheet():render()})}
  if(!d1){render();return}
  kitDb=d1;docRef=d1.doc("planner/main");
  const to=setTimeout(()=>setSync("Enregistré sur ce téléphone"),10000);
  docRef.onSnapshot(s=>{clearTimeout(to);const d=s.exists?s.data():null;
    if(d&&d.data&&d.client!==CLIENT&&(d.rev||0)>rev){st=normSt(d.data);if(applySeed())dirty=true;rev=d.rev||0;try{localStorage.setItem(LS,JSON.stringify({rev,data:st}))}catch(e){};P=null;if(dirty)flush();if(!S2||S2.end)render()}
    else if((!d||(d.rev||0)<rev)&&rev>=0){dirty=true;flush()}
    setSync("Synchronisé")},()=>{clearTimeout(to);setSync("Enregistré sur ce téléphone")});
  render();
}catch(e){render()}})();
</script>
